services:
  backend:
    build:
      context: ./backend
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3000
      DATABASE_URL: postgres://rc_dashboard:rc_dashboard@postgres:5432/rc_dashboard
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_TOPIC: rc/telemetry
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  simulator:
    build:
      context: ./simulator
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_TOPIC: rc/telemetry
      CAR_ID: rc-07
    depends_on:
      mqtt:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: rc_dashboard
      POSTGRES_USER: rc_dashboard
      POSTGRES_PASSWORD: rc_dashboard
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rc_dashboard -d rc_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    command: mosquitto -c /mosquitto-no-auth.conf

volumes:
  postgres-data:
